name: Deploy to Cloudflare Pages

# Free hosting: https://<project>.pages.dev — the site itself costs nothing.
# The live domain (telegup.mooo.com) is served by GitHub Pages from the
# neverdieclient/neverdieclient.github.io repository; this workflow is the
# optional second mirror.
#
# Two ways to publish:
#   A) through the Cloudflare dashboard (Workers & Pages → Connect to Git) —
#      then this workflow is not needed at all;
#   B) through this workflow — add the two secrets below in the repository
#      settings (Settings → Secrets and variables → Actions).
#
# Without the secrets the job stops at the first step and never breaks the
# main pipeline.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Secrets are not allowed in a job-level `if` — GitHub rejects such a
      # workflow with «Unrecognized named-value: 'secrets'» before a single
      # job starts. So the credentials are checked in a step instead.
      - name: Check the Cloudflare credentials
        id: creds
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$ACCOUNT_ID" ] && [ -n "$API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN are not set — the Cloudflare deployment is skipped."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: npm ci

      - name: Build
        # the site lives at the root of *.pages.dev, so the base path is "/"
        # (the GitHub Pages build uses /telegUP/ instead — see deploy.yml)
        if: steps.creds.outputs.ready == 'true'
        run: npm run build
        env:
          VITE_BASE: /

      - name: Publish to Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=telegup --branch=main
