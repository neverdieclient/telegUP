name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # .env.production carries the public publishable key; the base path
        # matches the project page URL https://<user>.github.io/telegUP/
        run: npm run build
        env:
          VITE_BASE: /telegUP/

      - name: Build dev channel
        # вторая сборка того же кода: уезжает в /dev/ и открыта только владельцу
        run: npm run build
        env:
          VITE_BASE: /telegUP/dev/
          VITE_OUT_DIR: dist/dev
          VITE_CHANNEL: dev

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4