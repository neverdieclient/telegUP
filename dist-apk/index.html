<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>telegUP</title>
    <style>
      html,body{height:100%;margin:0;background:#0a0a0a;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center}
      .w{text-align:center}.s{width:28px;height:28px;border:2px solid rgba(255,255,255,.15);border-top-color:#a3ff12;border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
      @keyframes sp{to{transform:rotate(360deg)}} .t{font:700 11px/1 system-ui;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.35)}
    </style>
  </head>
  <body>
    <div class="w"><div class="s"></div><div class="t">Загрузка</div></div>
  </body>
</html>
